[[stack]]
name = "technitium"
tags = ["dns", "pi_rack_1"]

[stack.config]
server = "pi_rack_1"
poll_for_updates = true
auto_update = true
destroy_before_deploy = false
git_account = "simtel12"
repo = "simtel12/komodo-app-stacks"
branch = "main"
reclone = false
run_directory = "services/technitium-dns"
file_paths = [
    "docker-compose.yaml"
]

environment = """
# Configuration directory
CONFIG_DIR=[[CONFIG_DIR]]

# Network and domain configuration
DOMAIN=[[OP__KOMODO__COMMON__DOMAIN]]

# Application configuration
TECHNITIUM_IMAGE=technitium/dns-server
TECHNITIUM_TAG=latest

# ADMIN_PASSWORD
DNS_SERVER_ADMIN_PASSWORD=[[OP__KOMODO__TECHNITIUM__TECHNITIUM_DNS_ADMIN_PASSWORD]]

DNS_SERVER_DOMAIN=dns-server.lan
"""