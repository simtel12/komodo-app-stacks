name: "xmrig"

services:
  xmrig:
    image: ghcr.io/metal3d/xmrig:${XMRIG_TAG:-latest}
    container_name: xmrig
    restart: unless-stopped
    # Needed for MSR access / hugepages
    privileged: true
    logging:
      driver: ${LOGGING_DRIVER:-local}
    environment:
      POOL_URL: "${XMRIG_POOL_URL}"
      POOL_USER: "${XMRIG_POOL_USER}"
      POOL_PASS: "${XMRIG_POOL_PASS}"
      ACCESS_TOKEN: "${XMRIG_ACCESS_TOKEN}"
      PRIORITY: 0
      CUDA: "false"
    volumes:
      - /dev/hugepages:/dev/hugepages:rw
